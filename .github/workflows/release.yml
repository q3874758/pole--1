name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    name: Release (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: cargo build --release --manifest-path Cargo.toml

      - name: Generate SBOMs
        run: |
          New-Item -ItemType Directory -Force -Path dist/packages | Out-Null
          .\target\release\pole-sbom.exe --manifest-path Cargo.toml --format cyclonedx --out dist/packages/sbom.cyclonedx.json
          .\target\release\pole-sbom.exe --manifest-path Cargo.toml --format spdx --out dist/packages/sbom.spdx.json

      - name: Package portable zip
        run: |
          Compress-Archive -Path target/release/pole.exe,target/release/pole-client.exe,target/release/pole-node.exe,target/release/pole-genesis.exe,target/release/pole-sbom.exe,"PoLE-一键运行.cmd","PoLE-停止运行.cmd" -DestinationPath dist/packages/PoLE-$env:VERSION-x64-portable.zip -Force

      - name: Compute checksums
        run: |
          cd dist/packages
          Get-ChildItem *.zip | ForEach-Object { certutil -hashfile $_.FullName SHA256 | Select-String -Pattern "^[a-f0-9]{64}" > "$($_.BaseName).sha256" }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          name: PoLE ${{ github.ref_name }} (Windows 一键极速版)
          generate_release_notes: true
          files: |
            dist/packages/*
          body: |
            ## PoLE ${{ github.ref_name }} Windows 一键极速运行版

            首个面向 PC 游戏生态的去中心化真实游玩证明与双边激励网络。

            ### 🚀 普通玩家极速下载与运行：
            1. **下载附件**：在下方 **Assets** 列表中下载 `PoLE-${{ github.ref_name }}-x64-portable.zip`
            2. **解压运行**：解压到任意文件夹（例如桌面），**双击 `PoLE-一键运行.cmd`**（或直接双击 `pole.exe`）
            3. **中文控制台**：系统将自动在后台极低能耗（<15MB 内存，<0.1% CPU）静默运行，并自动打开中文网页仪表盘：http://127.0.0.1:8787/
            4. **安全退出**：双击 `PoLE-停止运行.cmd` 即可完全退出。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
