name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_signing:
        description: "Skip code signing (for testing)"
        required: false
        default: "false"
        type: boolean

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ github.ref_name }}

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: |
          cargo build --release --manifest-path Cargo.toml
          strip target/release/pole target/release/pole-node target/release/pole-client target/release/pole-genesis target/release/pole-sbom

      - name: Build DEB package
        run: |
          mkdir -p dist/packages/deb-build/DEBIAN
          mkdir -p dist/packages/deb-build/etc/systemd/system
          mkdir -p dist/packages/deb-build/etc/pole
          mkdir -p dist/packages/deb-build/var/lib/pole
          mkdir -p dist/packages/deb-build/var/log/pole
          mkdir -p dist/packages/deb-build/opt/pole

          cp target/release/pole-node dist/packages/deb-build/opt/pole/
          cp target/release/pole-client dist/packages/deb-build/opt/pole/
          cp target/release/pole dist/packages/deb-build/opt/pole/
          cp packaging/linux/deb/pole-node.service dist/packages/deb-build/etc/systemd/system/
          cp packaging/linux/deb/node.json dist/packages/deb-build/etc/pole/node.json
          cp packaging/linux/deb/control dist/packages/deb-build/DEBIAN/
          cp packaging/linux/deb/conffiles dist/packages/deb-build/DEBIAN/
          cp packaging/linux/deb/postinst dist/packages/deb-build/DEBIAN/postinst
          cp packaging/linux/deb/prerm dist/packages/deb-build/DEBIAN/prerm
          chmod 755 dist/packages/deb-build/DEBIAN/postinst dist/packages/deb-build/DEBIAN/prerm

          # Strip the leading "v" from the tag so the deb name matches the
          # control Version (0.1.0, not v0.1.0). Persist for later steps —
          # `with.path` globs do NOT get bash expansion.
          DEB_VERSION="${VERSION#v}"
          echo "DEB_VERSION=$DEB_VERSION" >> "$GITHUB_ENV"
          dpkg-deb --build dist/packages/deb-build "dist/packages/pole-node_${DEB_VERSION}_amd64.deb"

      - name: Compute checksums
        run: |
          cd dist/packages
          sha256sum "pole-node_${{ env.DEB_VERSION }}_amd64.deb" > "pole-node_${{ env.DEB_VERSION }}_amd64.deb.sha256"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/packages/pole-node_${{ env.DEB_VERSION }}_amd64.deb
            dist/packages/pole-node_${{ env.DEB_VERSION }}_amd64.deb.sha256

  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: cargo build --release --manifest-path Cargo.toml

      - name: Create portable zip
        run: |
          New-Item -ItemType Directory -Force -Path dist/packages | Out-Null
          Compress-Archive -Path target/release/pole.exe,target/release/pole-client.exe,target/release/pole-node.exe,target/release/pole-genesis.exe,target/release/pole-sbom.exe -DestinationPath dist/packages/PoLE-$env:VERSION-x64-portable.zip -Force

      - name: Compute checksums
        run: |
          cd dist/packages
          Get-ChildItem *.exe | ForEach-Object { certutil -hashfile $_.FullName SHA256 | Select-String -Pattern "^[a-f0-9]{64}" > "$($_.BaseName).sha256" }
          Get-ChildItem *.zip | ForEach-Object { certutil -hashfile $_.FullName SHA256 | Select-String -Pattern "^[a-f0-9]{64}" > "$($_.BaseName).sha256" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/packages/*.zip
            dist/packages/*.sha256

  release-github:
    needs: [release-linux, release-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for `cosign sign-blob` keyless signing
      # (OIDC token from GitHub Actions).
      id-token: write
      # Required for `cosign sign-blob` to write the signing
      # certificate back into the GitHub Actions cache (used to
      # verify against Rekor).
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create portable tarball (Linux binary + client)
        run: |
          mkdir -p dist/release
          cp "artifacts/linux-artifacts/pole-node_${VERSION#v}_amd64.deb" dist/release/
          cp artifacts/windows-artifacts/PoLE-${VERSION}-x64-portable.zip dist/release/
          cp artifacts/linux-artifacts/*.sha256 dist/release/
          cp artifacts/windows-artifacts/*.sha256 dist/release/

      - name: Build pole-sbom
        run: cargo build --release --bin pole-sbom

      - name: Emit CycloneDX SBOM
        run: |
          ./target/release/pole-sbom \
            --manifest-path Cargo.toml \
            --format cyclonedx \
            --out dist/release/sbom.cyclonedx.json

      - name: Emit SPDX SBOM
        run: |
          ./target/release/pole-sbom \
            --manifest-path Cargo.toml \
            --format spdx \
            --out dist/release/sbom.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SBOMs with cosign (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for sbom in dist/release/sbom.cyclonedx.json dist/release/sbom.spdx.json; do
            echo "==> Signing $sbom"
            cosign sign-blob \
              --output-signature "${sbom}.sig" \
              --output-certificate "${sbom}.pem" \
              --yes \
              "$sbom"
          done

      - name: Verify signatures
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for sbom in dist/release/sbom.cyclonedx.json dist/release/sbom.spdx.json; do
            echo "==> Verifying $sbom"
            cosign verify-blob \
              --signature "${sbom}.sig" \
              --certificate "${sbom}.pem" \
              --certificate-identity-regexp 'https://github.com/q3874758/pole--1' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$sbom"
          done

      # ---- stable.json (release manifest) cosign keyless signing ----
      # V1 hard card #2: the `signature = "dev-signature"` placeholder in
      # dist/release-manifests/stable.json must be replaced by a real
      # cosign keyless signature at release time. We stage the manifest
      # under dist/release/, sign it, and let the GH Release glob pick
      # it up alongside its .sig / .cert sidecars (see `files:` below).
      - name: Stage release manifest
        run: |
          mkdir -p dist/release
          cp dist/release-manifests/stable.json dist/release/stable.json
          # The committed manifest carries the source-tree version (0.1.0);
          # stamp the actual release version (tag without leading "v") so the
          # update channel's version comparison is correct for this tag.
          MANIFEST_VERSION="${VERSION#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$MANIFEST_VERSION\"/" dist/release/stable.json
          echo "staged stable.json version=$MANIFEST_VERSION"
          grep '"version"' dist/release/stable.json

      - name: Sign stable.json (cosign keyless OIDC + Rekor)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature dist/release/stable.json.sig \
            --output-certificate dist/release/stable.json.cert \
            dist/release/stable.json

      - name: Verify stable.json signature
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign verify-blob \
            --signature dist/release/stable.json.sig \
            --certificate dist/release/stable.json.cert \
            --certificate-identity-regexp 'https://github.com/q3874758/pole--1' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            dist/release/stable.json

      - name: Generate release notes
        # Unquoted heredoc so ${VERSION} expands; backticks are escaped
        # (\`) so bash does not run command substitution on them.
        run: |
          cat > dist/release/RELEASE_NOTES.md << EOF
          # PoLE ${VERSION} Release Notes

          ## Downloads
          - **Windows Portable**: \`PoLE-${VERSION}-x64-portable.zip\` - No installation required
          - **Linux DEB**: \`pole-node_${VERSION#v}_amd64.deb\` - For Debian/Ubuntu systems

          ## Software Bill of Materials (SBOM)
          - \`sbom.cyclonedx.json\` — CycloneDX 1.5, signed with [cosign](https://docs.sigstore.dev/)
          - \`sbom.spdx.json\` — SPDX 2.3, signed with cosign
          - Each \`.sig\` / \`.pem\` pair proves the SBOM was produced by
            this repository's CI at tag \`${VERSION}\`.

          ## Verifying SBOM signatures
          \`\`\`bash
          # Requires cosign >= 2.0
          cosign verify-blob \
            --signature sbom.cyclonedx.json.sig \
            --certificate sbom.cyclonedx.json.pem \
            --certificate-identity-regexp 'https://github.com/q3874758/pole--1' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            sbom.cyclonedx.json
          \`\`\`

          ## What's New
          - Full PoLE protocol implementation with hour-based reward blocks
          - P2P network with libp2p (QUIC, TCP, mDNS, Kademlia)
          - Local Web control console (browser dashboard via control API)
          - Windows Service and Linux systemd integration
          - Automatic update with rollback support
          - Challenge and dispute resolution system

          ## Windows Installation
          1. Download \`PoLE-${VERSION}-x64-portable.zip\`
          2. Extract to any folder
          3. Run \`pole-node.exe\` (daemon) and \`pole-client.exe\` (CLI)

          ## Linux Installation
          \`\`\`bash
          sudo dpkg -i pole-node_${VERSION#v}_amd64.deb
          sudo systemctl enable pole-node
          sudo systemctl start pole-node
          \`\`\`

          ## Verification
          Checksums are provided in \`.sha256\` files alongside each artifact.
          SBOM signatures are provided as \`.sig\` / \`.pem\` pairs.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            dist/release/*
          body_path: dist/release/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
