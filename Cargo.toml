[package]
name = "pole"
version = "0.1.2"
edition = "2021"
rust-version = "1.75"
publish = false
description = "PoLE V1 player-first hourly reward client and node runtime"
license = "MIT OR Apache-2.0"
authors = ["PoLE Project Contributors"]
homepage = "https://github.com/q3874758/pole--1"
repository = "https://github.com/q3874758/pole--1"
readme = "README.md"
keywords = ["blockchain", "cosmos", "gaming", "proof-of-engagement", "validator"]
categories = ["cryptography", "network-programming", "game-development"]
exclude = [
    "/chain/poled.exe",
    "/chain/.tmp-poled-home/**",
    "/dist/**",
    "/target/**",
    "/pole-node-data/**",
    "/vendor/**",
    "*.log",
    "*.pid",
]

[lib]
name = "pole_protocol_draft"
path = "src/lib.rs"

[dependencies]
borsh = { version = "1.6", features = ["derive"] }
cosmos-sdk-proto = { version = "0.20", default-features = false }
ed25519-dalek = "2"
aes-gcm = "0.10"
base64 = "0.22"
bech32 = "0.9"
hex = "0.4"
rand = "0.9"
scrypt = "0.11"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["der"] }
x509-parser = "0.17"
thiserror = "2"
zeroize = "1.8"
rpassword = "7.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.51.0", features = ["rt-multi-thread", "time"] }
cargo_metadata = { version = "0.23.1", default-features = false }
sha3 = "0.10"

[features]
default = []
# `integration` is referenced by `tests/harness/mod.rs::HARNESS_FEATURE` and
# gates real-`poled` bring-up tests. It is intentionally empty (no extra deps)
# because the gated tests only depend on a built `poled` binary on $PATH.
integration = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.51.0", features = ["rt-multi-thread", "time", "macros"] }

[[bin]]
name = "pole-client"
path = "src/bin/pole-client.rs"

[[bin]]
name = "pole-node"
path = "src/bin/pole-node.rs"

[[bin]]
name = "pole"
path = "src/bin/pole.rs"

[[bin]]
name = "pole-genesis"
path = "src/bin/pole-genesis.rs"

[[bin]]
name = "pole-sbom"
path = "src/bin/pole-sbom.rs"
