syntax = "proto3";

package pole.chain.pole.v1;

option go_package = "x/pole/types";

import "cosmos/msg/v1/msg.proto";
import "pole/chain/pole/v1/state.proto";

service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc UpsertNode(MsgUpsertNode) returns (MsgUpsertNodeResponse);
  rpc UpsertAggregateRecord(MsgUpsertAggregateRecord) returns (MsgUpsertAggregateRecordResponse);
  rpc SubmitBatch(MsgSubmitBatch) returns (MsgSubmitBatchResponse);
  rpc SubmitReplicaReceipt(MsgSubmitReplicaReceipt) returns (MsgSubmitReplicaReceiptResponse);
  rpc CommitEpoch(MsgCommitEpoch) returns (MsgCommitEpochResponse);
  rpc OpenChallenge(MsgOpenChallenge) returns (MsgOpenChallengeResponse);
  rpc ResolveChallenge(MsgResolveChallenge) returns (MsgResolveChallengeResponse);
  rpc FinalizeEpoch(MsgFinalizeEpoch) returns (MsgFinalizeEpochResponse);
  rpc VerifyBatch(MsgVerifyBatch) returns (MsgVerifyBatchResponse);
  rpc ClaimReward(MsgClaimReward) returns (MsgClaimRewardResponse);
  rpc UpsertGameWeight(MsgUpsertGameWeight) returns (MsgUpsertGameWeightResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  rpc SubmitPlaySession(MsgSubmitPlaySession) returns (MsgSubmitPlaySessionResponse);
  rpc SubmitPlayHeartbeat(MsgSubmitPlayHeartbeat) returns (MsgSubmitPlayHeartbeatResponse);
  rpc AttestSession(MsgAttestSession) returns (MsgAttestSessionResponse);
  rpc SettleSession(MsgSettleSession) returns (MsgSettleSessionResponse);
  rpc SubmitRewardRecords(MsgSubmitRewardRecords) returns (MsgSubmitRewardRecordsResponse);
  rpc ActivityBurn(MsgActivityBurn) returns (MsgActivityBurnResponse);
}

message MsgUpsertNode {
  option (cosmos.msg.v1.signer) = "operator";

  string operator = 1;
  NodeRecord node = 2;
}

message MsgUpsertNodeResponse {}

message MsgUpsertAggregateRecord {
  option (cosmos.msg.v1.signer) = "operator";

  string operator = 1;
  AggregateRecord aggregate_record = 2;
}

message MsgUpsertAggregateRecordResponse {}

message MsgSubmitBatch {
  option (cosmos.msg.v1.signer) = "collector";

  string collector = 1;
  BatchCommit batch_commit = 2;
}

message MsgSubmitBatchResponse {}

message MsgSubmitReplicaReceipt {
  option (cosmos.msg.v1.signer) = "storer";

  string storer = 1;
  ReplicaReceipt replica_receipt = 2;
}

message MsgSubmitReplicaReceiptResponse {}

message MsgCommitEpoch {
  option (cosmos.msg.v1.signer) = "proposer";

  string proposer = 1;
  EpochCommit epoch_commit = 2;
}

message MsgCommitEpochResponse {}

message MsgOpenChallenge {
  option (cosmos.msg.v1.signer) = "challenger";

  string challenger = 1;
  Challenge challenge = 2;
}

message MsgOpenChallengeResponse {}

message MsgResolveChallenge {
  option (cosmos.msg.v1.signer) = "resolver";

  string resolver = 1;
  string challenge_id_hex = 2;
  uint64 slash_amount = 3;
  uint64 challenger_reward = 4;
  string resolution_summary = 5;
  ChallengeState final_state = 6;
  uint32 slash_fraction_bps = 7;
  bool jail_validator = 8;
}

message MsgResolveChallengeResponse {}

message MsgFinalizeEpoch {
  option (cosmos.msg.v1.signer) = "finalizer";

  string finalizer = 1;
  uint64 epoch_id = 2;
}

message MsgFinalizeEpochResponse {}

message MsgVerifyBatch {
  option (cosmos.msg.v1.signer) = "verifier";

  string verifier = 1;
  uint64 epoch_id = 2;
  string target_batch_root_hex = 3;
  string target_collector = 4;
  bool is_player = 5;
  bool verified = 6;
  string signature_hex = 7;
}

message MsgVerifyBatchResponse {}

message MsgClaimReward {
  option (cosmos.msg.v1.signer) = "claimer";

  string claimer = 1;
  uint64 epoch_id = 2;
  string recipient = 3;
}

message MsgClaimRewardResponse {
  RewardRecord reward_record = 1;
}

message MsgUpsertGameWeight {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1;
  GameWeightEntry entry = 2;
}

message MsgUpsertGameWeightResponse {}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1;
  Params params = 2;
}

message MsgUpdateParamsResponse {}

message MsgSubmitPlaySession {
  option (cosmos.msg.v1.signer) = "node_address";

  string node_address = 1;
  PlaySession session = 2;
}

message MsgSubmitPlaySessionResponse {}

message MsgSubmitPlayHeartbeat {
  option (cosmos.msg.v1.signer) = "node_address";

  string node_address = 1;
  PlayHeartbeat heartbeat = 2;
}

message MsgSubmitPlayHeartbeatResponse {}

message MsgAttestSession {
  option (cosmos.msg.v1.signer) = "witness";

  string witness = 1;
  WitnessAttestation attestation = 2;
}

message MsgAttestSessionResponse {}

message MsgSettleSession {
  option (cosmos.msg.v1.signer) = "settler";

  string settler = 1;
  string session_id_hex = 2;
}

message MsgSettleSessionResponse {
  SessionSettlement settlement = 1;
}

// MsgSubmitRewardRecords is the live reward-record submission path. Before
// it, reward records entered the store only via genesis or challenge
// resolution, so a claim against a proposer-committed reward root could
// never find its record and always failed. The proposer submits the
// epoch's reward records; the chain recomputes the rewards root from them
// and requires it to match the committed root, which closes the
// "commitment with no backing records" gap.
message MsgSubmitRewardRecords {
  option (cosmos.msg.v1.signer) = "proposer";

  string proposer = 1;
  uint64 epoch_id = 2;
  repeated RewardRecord records = 3;
}

message MsgSubmitRewardRecordsResponse {
  string reward_root_hex = 1;
  uint32 leaf_count = 2;
}

// MsgActivityBurn destroys tokens directly from a user account for application
// activities (event ticket, guild boost, publisher promotion), contracting net supply.
message MsgActivityBurn {
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1;
  uint64 amount = 2;
  string activity_id = 3;
  string burn_type = 4;
  string memo = 5;
}

message MsgActivityBurnResponse {
  uint64 burned_amount = 1;
}

